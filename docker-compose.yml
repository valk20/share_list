services:
# ─── DATABASE ────────────────────────────────────────────────────────────────
  db:
    image: mysql:latest
    container_name: database_v1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-postgres}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-listshare}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
# ─── API ───────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: ./docker/api.dockerfile
    container_name: api_v1
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
# ─── VOLUMES ───────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
