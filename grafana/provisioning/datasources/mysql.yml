apiVersion: 1

datasources:
  - name: MySQL-ListShare
    type: mysql
    uid: mysql_listshare_ds      # Fixed UID so dashboards always find this datasource
    url: ${GF_MYSQL_HOST}:3306  # e.g., db:3306
    user: ${GF_MYSQL_USER}      # e.g., grafana_reader
    isDefault: true
    editable: false             # Prevents editing in UI (Infrastructure as Code best practice)
    jsonData:
      database: ${GF_MYSQL_DATABASE}
      maxOpenConns: 10          # Match MySQL MAX_USER_CONNECTIONS
      maxIdleConns: 2
      connMaxLifetime: 14400    # 4 hours (in seconds)
      tlsAuth: false
      tlsSkipVerify: true       # Or configure TLS certificates for remote DBs
    secureJsonData:
      password: ${GF_MYSQL_PASSWORD}